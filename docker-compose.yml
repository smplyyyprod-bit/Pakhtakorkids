services:
  postgres:
    image: postgres:16-alpine
    container_name: pk_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-coaching_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-coaching_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host by default - the bot reaches it over the
    # compose network. Uncomment only if you need external access.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coaching_user} -d ${DB_NAME:-coaching_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pk_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bot:
    build: .
    container_name: pk_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
      TELEGRAM_ADMIN_IDS: ${TELEGRAM_ADMIN_IDS:-}
      TELEGRAM_MANAGER_IDS: ${TELEGRAM_MANAGER_IDS:-}
      DATABASE_URL: postgresql://${DB_USER:-coaching_user}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-coaching_management}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-Asia/Tashkent}
      AUTO_REPORT_GENERATION_TIME: ${AUTO_REPORT_GENERATION_TIME:-23:30}
      INCOMPLETE_REPORT_REMINDER_TIME: ${INCOMPLETE_REPORT_REMINDER_TIME:-19:00}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
